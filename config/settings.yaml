# ChronoScalp strategy/risk configuration — Institutional Scalper Edition v3.
# Safe to version-control — no secrets here (secrets live only in .env).

symbols:
  # LiteFinance demo tradeable names (spot FX/gold use "_o" suffix).
  - "BTCUSD"
  - "ETHUSD"
  - "XAUUSD_o"
  - "EURUSD_o"
  - "USDJPY_o"
  - "EURJPY_o"

timeframes:
  # v3 trend filter uses M15 + M5 institutional bias (Session VWAP).
  higher_trend: ["M15", "M5"]
  entry_trigger: ["M1"]
  ultra_scalp:
    higher_trend: ["M15", "M5"]
    entry_trigger: ["S15"]
    poll_interval_seconds: 2

indicators:
  ema_period_trend: 50
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  bollinger_period: 20
  bollinger_std_dev: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  rvol_period: 20

strategy:
  # session_vwap = institutional bias; ema_rsi = legacy EMA50+RSI
  trend_engine: session_vwap
  # institutional = sweep+MSS+RVOL+SMC; legacy_macd = old MACD path
  entry_engine: institutional
  require_trend_alignment: true
  enabled_strategies:
    - smc_confluence
    - liquidity_volume
    - ultra_scalp
  use_smc_confluence: true
  use_liquidity_volume: true
  use_ultra_scalp: true
  liquidity_rvol_min: 1.5
  entry_rvol_min: 1.5
  atr_stop_multiple: 1.5
  atr_target_multiple: 2.25
  min_signal_confidence: 0.55
  ultra_scalp:
    atr_stop_multiple: 1.0
    atr_target_multiple: 1.0
    min_reward_risk_ratio: 1.0
    rvol_min: 1.3
    impulse_body_atr_multiple: 0.4
    trend_mode: strict
    require_confluence: false

sessions:
  timezone: "GMT"
  windows:
    london: { start: "08:00", end: "11:00" }
    new_york: { start: "13:30", end: "16:30" }
  trade_outside_sessions: false
  always_on_symbols:
    - "BTCUSD"
    - "ETHUSD"

news_filter:
  enabled: true
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  high_impact_only: true

risk:
  max_risk_per_trade_pct: 1.0
  risk_presets_pct: [0.5, 1.0, 1.5]
  active_risk_per_trade_pct: 1.0
  min_reward_risk_ratio: 1.5
  max_daily_loss_pct: 3.0
  max_concurrent_positions: 3
  use_kelly_sizing: false
  breakeven_at_r_multiple: 1.0
  trailing_stop_atr_multiple: 1.5
  # v3 institutional guards
  three_strikes:
    enabled: true
    max_losses: 3
    pause_hours: 12
  correlation:
    enabled: true
    period: 20
    max_abs_corr: 0.80
  volatility_guard:
    enabled: true
    min_atr_close_ratio: 0.0005
    max_atr_close_ratio: 0.02
  spread_ma_guard:
    enabled: true
    window: 100
    multiplier: 1.2
  daily_drawdown_close_all: true
  partial_tp:
    enabled: true
    r_multiple: 1.2
    close_fraction: 0.5
  chandelier:
    enabled: true
    lookback: 22
    atr_multiple: 2.5

spread_filter:
  enabled: true
  sample_live_spread: true
  spread_history_dir: "data/spread_history"
  max_spread_pips:
    XAUUSD: 35
    XAUUSD_o: 35
    EURUSD: 2.0
    EURUSD_o: 2.0
    EURJPY: 3.0
    EURJPY_o: 3.0
    USDJPY: 2.0
    USDJPY_o: 2.0
    BTCUSD: 50
    ETHUSD: 50

ml:
  enabled: false
  model_path: "data/models/setup_classifier.joblib"

execution:
  broker: "paper"
  data_source: "auto"
  slippage_pips: 0.5
  poll_interval_seconds: 5
  trade_on_bar_close_only: true
  state_dir: "data/state"
  magic_number: 20260711

backtest:
  initial_balance: 10000
  commission_per_lot: 7.0
  default_spread_pips:
    XAUUSD: 20
    XAUUSD_o: 20
    EURUSD: 1.0
    EURUSD_o: 1.0
    EURJPY: 1.5
    EURJPY_o: 1.5
    USDJPY: 1.2
    USDJPY_o: 1.2
    BTCUSD: 25
    ETHUSD: 25

resilience:
  max_consecutive_errors: 5
  reconcile_interval_seconds: 60
  skip_heartbeat_seconds: 300
  alert_on_daily_loss_limit: true
  stale_data_seconds: 120
