# ChronoScalp strategy/risk configuration — Institutional Scalper Edition v3.
# Safe to version-control — no secrets here (secrets live only in .env).

symbols:
  # Active trade universe. EURUSD removed after broker-native 45d cost-stress +
  # limited WF OOS failure (see docs/STRATEGY_RESEARCH.md). Keep specs in
  # symbols.yaml for research/backtests only.
  - "BTCUSD"
  - "ETHUSD"
  - "XAUUSD_o"
  - "USDJPY_o"
  - "EURJPY_o"

# Map canonical / panel names → broker Market Watch names (LiteFinance).
broker_symbol_aliases:
  XAUUSD: XAUUSD_o
  EURUSD: EURUSD_o
  USDJPY: USDJPY_o
  EURJPY: EURJPY_o
  XAUEUR: XAUEUR_o

timeframes:
  # v3 trend filter uses M15 + M5 institutional bias (Session VWAP).
  higher_trend: ["M15", "M5"]
  entry_trigger: ["M1"]
  ultra_scalp:
    higher_trend: ["M15", "M5"]
    entry_trigger: ["S15"]
    poll_interval_seconds: 2

indicators:
  ema_period_trend: 50
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  bollinger_period: 20
  bollinger_std_dev: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  rvol_period: 20

strategy:
  # session_vwap = institutional bias; ema_rsi = legacy EMA50+RSI
  trend_engine: session_vwap
  # institutional = sweep+MSS+RVOL+SMC; legacy_macd = old MACD path
  entry_engine: institutional
  require_trend_alignment: true
  # Selecting a symbol activates its catalog. Overlay enabled_strategies
  # is ignored while this is true. M1 ultra_scalp is off after the
  # 2026-08-27..09-03 live week: 46 CS_ultra_scalp tickets, -$6.9k.
  # EURUSD Delta stays off the EUR book (failed 4/4 stop-outs, E[R] -1.00).
  derive_strategies_from_symbols: true
  symbol_catalogs:
    XAUUSD:
      - delta
      - news_straddle
    EURUSD:
      - delta
      - news_straddle
  enabled_strategies:
    - delta
    - news_straddle
  use_smc_confluence: false
  use_liquidity_volume: false
  use_ultra_scalp: false
  use_news_straddle: true
  use_xau_vwap_pullback: false
  liquidity_rvol_min: 1.5
  # Shared institutional floor; per-symbol books override via symbol_overrides.
  # Live 2026-08-31: gold/EUR bars sat at rvol 0.80-1.46 against a 1.50 gate,
  # so SMC/liquidity never fired. Gold uses Delta's 1.15 (the only book with
  # positive broker-native evidence). EUR is quieter — 1.20, not 1.50.
  entry_rvol_min: 1.5
  symbol_overrides:
    XAUUSD:
      entry_rvol_min: 1.15
      atr_stop_multiple: 1.5
      atr_target_multiple: 2.25
    EURUSD:
      entry_rvol_min: 1.20
      atr_stop_multiple: 1.8
      atr_target_multiple: 2.70
  delta:
    # Catalog-owned: gold is validated (PF 1.75 / +0.28R). EURUSD sweep-Delta
    # is failed (4 trades / −1.00R). EUR is back on the book as fade/pullback
    # only (operator M5 overbought-in-H1-downtrend), not the failed sweep path.
    allowed_symbols: [XAUUSD, EURUSD]
    structure_lookback: 12
    slope_bars: 3
    rvol_min: 1.15
    min_body_fraction: 0.45
    min_atr_close_ratio: 0.00004
    max_atr_close_ratio: 0.004
    # Operator magic=0 gold (14d to 2026-09-03): 7 bursts, 86% basket WR,
    # Iran 13:00-18:00, M15 ADX always ≥22. Large wins faded RSI/Stoch spikes;
    # buys were M5 pullbacks in an HTF uptrend. Encode those two indicators.
    # Do not copy 6-25 lot scale-in. Floor stays 1.5R (gold TP at the floor
    # matches the operator's 2-12 minute / $4-6 hold better than 1.8R).
    operator_style:
      enabled: true
      min_adx: 25
      fade_rsi: 70
      fade_stoch: 80
      pullback_stoch: 25
      allowed_setups:
        - sweep_reclaim
        - breakout_retest
        - fade_extension
        - htf_pullback
    # Scale stops off a higher timeframe, not the M1 trigger bar. Measured
    # 2026-08-26: XAUUSD M1 ATR $1.57 vs median M1 bar range $1.50, so the old
    # 0.8-2.5x M1 band ($1.26-$3.93) put the minimum stop *inside* one average
    # candle. EURUSD was worse (0.75 pip minimum vs 0.90 pip median bar).
    # higher_trend is ["M15", "M5"], so index 1 = M5.
    stop_atr_source: htf
    stop_atr_htf_index: 1
    stop_buffer_atr: 0.20
    min_stop_atr: 0.80
    max_stop_atr: 2.00
    min_stop_spread_multiple: 2.0
    # Round-trip spread must stay under this share of the money at risk.
    max_cost_fraction_of_risk: 0.15
    reward_risk_ratio: 1.50
    # Per-symbol geometry: gold's M5 ATR is ~$4.26 while EURUSD's is ~2.0 pips,
    # and their M5/M1 ATR ratios differ (2.7x vs 2.2x), so one band cannot fit
    # both. Any Delta key above may be overridden per symbol.
    symbol_overrides:
      XAUUSD:
        min_stop_atr: 0.80
        max_stop_atr: 2.00
        reward_risk_ratio: 1.50
      EURUSD:
        min_stop_atr: 1.50
        max_stop_atr: 3.50
        reward_risk_ratio: 1.50
        operator_style:
          enabled: true
          min_adx: 20
          fade_rsi: 70
          fade_stoch: 80
          pullback_stoch: 25
          allowed_setups:
            - fade_extension
            - htf_pullback
    # Recorded broker-native verdict per symbol. Surfaced by the live-loop
    # startup gate profile and Telegram status so an unvalidated symbol cannot
    # be enabled unknowingly. Reported, never enforced — enabling anyway stays
    # the operator's decision. Only edit from a recorded validation run
    # (docs/STRATEGY_DELTA.md), never to justify a live enable.
    symbol_validation:
      # 2026-08-29 parity engine, 2026-06-27..2026-08-11: 48 trades, WR 62.5%,
      # PF 1.754, E[R] +0.284, maxDD 6.14%; PF 1.751 at 1.5x costs.
      XAUUSD: validated
      # 2026-08-29 same window and engine: 4 trades, 0% wins, E[R] exactly
      # -1.00 — every one a full stop-out, none reached breakeven or the trail.
      EURUSD: failed
  atr_stop_multiple: 1.5
  atr_target_multiple: 2.25
  min_signal_confidence: 0.55
  ultra_scalp:
    # M1 impulse scalp as a per-symbol candidate — NOT the old S15 mode that
    # switched the whole bot to 15-second bars. S15 + 1:1 R:R is what produced
    # the −$24k journal bleed. 1.5 R:R and cost-aware geometry stay on.
    use_s15_trigger: false
    atr_stop_multiple: 2.5
    atr_target_multiple: 4.0
    min_reward_risk_ratio: 1.5
    rvol_min: 1.2
    impulse_body_atr_multiple: 0.35
    trend_mode: primary
    require_confluence: false
    cost_aware_geometry: true
    min_stop_spread_multiple: 2.0
    net_rr_after_costs: 1.25
    max_stop_atr_multiple: 8.0
    max_target_atr_multiple: 12.0
    allowed_symbols: [XAUUSD, EURUSD]
    symbol_overrides:
      XAUUSD:
        rvol_min: 1.15
        atr_stop_multiple: 2.5
        atr_target_multiple: 4.0
        impulse_body_atr_multiple: 0.40
      EURUSD:
        rvol_min: 1.20
        atr_stop_multiple: 3.0
        atr_target_multiple: 4.8
        impulse_body_atr_multiple: 0.45
  news_straddle:
    # Dynamic ATR BUY_STOP + SELL_STOP around high-impact releases (MT5/paper).
    atr_period: 14
    atr_multiplier: 2.0
    max_spread_pips: 2.0
    pause_minutes_before: 2.0
    place_seconds_before: 30.0
    expiry_seconds: 120.0
    # SL/TP as fractions of ATR distance → R:R = 1.8/0.8 = 2.25 (≥ 1.5 floor)
    sl_distance_fraction: 0.8
    tp_distance_fraction: 1.8
    comment_prefix: "CS_News"
    title_tokens: null
    require_session: false
    symbol_overrides:
      XAUUSD:
        # Gold reacts to USD macro + gold-specific prints. Broker quotes gold
        # spread in points (~12-13 typical on AUSCommercial-Demo 2026-08-31).
        title_tokens:
          - nfp
          - nonfarm
          - cpi
          - pce
          - ppi
          - fomc
          - fed
          - rate
          - gold
        max_spread_pips: 25.0
        atr_multiplier: 2.2
      EURUSD:
        title_tokens:
          - nfp
          - nonfarm
          - cpi
          - pce
          - fomc
          - ecb
          - euro
          - germany
          - rate
        max_spread_pips: 2.5
        atr_multiplier: 2.0

  xau_vwap_pullback:
    # Kept for research / tests. Not in the live catalog.
    enabled: false
    shadow_only: true
    live_ready: true
    allowed_symbols: [XAUUSD]
    ema_slope_bars: 3
    impulse_lookback: 8
    impulse_swing_bars: 10
    impulse_body_atr: 0.6
    impulse_rvol_min: 1.10
    impulse_expire_m1_bars: 6
    min_body_fraction: 0.45
    level_touch_atr: 0.20
    no_chase_atr: 0.25
    trigger_expire_m1_bars: 2
    sl_buffer_atr: 0.15
    min_stop_atr: 0.70
    max_stop_atr: 1.80
    reward_risk_ratio: 2.0
    cost_stress_multiple: 1.5
    min_net_rr_cost_stress: 1.25
    min_score: 5
    m1_rvol_score_min: 1.10
    spread_median_expansion: 1.2

sessions:
  timezone: "UTC"
  # london_ny = only London + New York windows; always_on_24h = trade any time
  trading_hours_mode: london_ny
  windows:
    # London extended to 13:00 local so Iran 13:00-15:30 (operator gold bursts)
    # is not stuck in the London/NY gap. NY still covers NFP 08:30 ET.
    london: { start: "08:00", end: "13:00" }
    new_york: { start: "08:30", end: "11:30" }
  market_timezones:
    london: Europe/London
    new_york: America/New_York
  trade_outside_sessions: false
  # Legacy per-symbol bypass — ignored when trading_hours_mode is explicitly london_ny
  always_on_symbols:
    - "BTCUSD"
    - "ETHUSD"

news_filter:
  enabled: true
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  high_impact_only: true

risk:
  max_risk_per_trade_pct: 1.0
  risk_presets_pct: [0.5, 1.0, 1.5]
  active_risk_per_trade_pct: 1.0
  min_reward_risk_ratio: 1.5
  max_daily_loss_pct: 3.0
  max_portfolio_heat_pct: 3.0
  # When false: daily loss / DD cutoff does not block new entries (operator toggle).
  # Per-trade 1% risk and min R:R are unchanged.
  daily_loss_limit_enabled: true
  # One open position per symbol is already enforced; this cap is portfolio-wide.
  # Keep >= number of active symbols so pairs do not block each other.
  max_concurrent_positions: 8
  # When true: each symbol may open independently (no cross-pair correlation block;
  # max_concurrent is at least len(active symbols)). Per-trade 1% risk / R:R unchanged.
  independent_symbol_entries: true
  use_kelly_sizing: false
  breakeven_at_r_multiple: 1.0
  trailing_stop_atr_multiple: 1.5
  # Do not trail before the trade is this far in profit. At 0 the trail runs
  # from entry: current_price - 1.5*ATR sits inside any structural stop wider
  # than 1.5 ATR, so stops were pulled to noise distance within seconds of
  # opening (live polls every 2-5s vs one trail per bar in backtest).
  trailing_start_r_multiple: 1.0
  # v3 institutional guards
  three_strikes:
    enabled: true
    max_losses: 3
    pause_hours: 12
  # Deterministic learn-from-mistakes veto (not ML). Does not change 1%/3% ceilings.
  mistake_memory:
    enabled: true
    cooldown_minutes: 240
    max_repeats: 1
    min_loss_r: 0.0
    match_session: true
    match_exit_type: false
    persist: true
  correlation:
    # Off by default with independent_symbol_entries — re-enable only if you want
    # correlated pairs to suppress each other.
    enabled: false
    period: 20
    max_abs_corr: 0.80
  volatility_guard:
    enabled: true
    # Use M5 ATR/close for regime (not S15/M1 trigger). Ultra-scalp S15 ATR
    # ratios sit well below 0.0005 and previously blocked every symbol.
    timeframe: M5
    min_atr_close_ratio: 0.00005
    max_atr_close_ratio: 0.05
  spread_ma_guard:
    enabled: true
    window: 100
    # Baseline is the median, so the multiplier means "N times the typical
    # spread". The old mean-based 1.2 rejected roughly every above-average
    # quote: live logs showed normal 0.30-pip EURUSD spreads blocked against a
    # 0.11 mean that a few news spikes had inflated.
    multiplier: 2.5
    symbol_overrides:
      # Live 2026-08-31: XAUUSD printed 12-13 against a median of 4-5, so the
      # shared 2.5x test treated a normal gold quote as an outlier. Gold's
      # typical spread on this broker is ~12 points — floor the baseline there.
      XAUUSD:
        min_baseline_pips: 12.0
        multiplier: 2.5
      EURUSD:
        min_baseline_pips: 0.20
        multiplier: 2.5
  daily_drawdown_close_all: true
  partial_tp:
    enabled: true
    r_multiple: 1.2
    close_fraction: 0.5
  chandelier:
    enabled: true
    lookback: 22
    atr_multiple: 2.5

spread_filter:
  enabled: true
  sample_live_spread: true
  spread_history_dir: "data/spread_history"
  max_spread_pips:
    XAUUSD: 35
    XAUUSD_o: 35
    EURUSD: 2.0
    EURUSD_o: 2.0
    EURJPY: 3.0
    EURJPY_o: 3.0
    USDJPY: 2.0
    USDJPY_o: 2.0
    BTCUSD: 50
    ETHUSD: 50

ml:
  enabled: false
  model_path: "data/models/setup_classifier.joblib"

execution:
  broker: "paper"
  data_source: "auto"
  slippage_pips: 0.5
  poll_interval_seconds: 5
  trade_on_bar_close_only: true
  state_dir: "data/state"
  magic_number: 20260711
  # comparison = independent virtual books (paper default). live = shared 3% heat.
  multi_strategy_mode: comparison

backtest:
  initial_balance: 10000
  # Walk each bar as open -> low -> high -> close (up bar) or open -> high ->
  # low -> close (down bar) and re-check stops on every leg. Live polls every
  # few seconds, so a stop trailed up on the high can be taken by the pullback
  # inside the same bar; the old close-only model could not represent that and
  # therefore reported far fewer stop-outs than live produced. Set false only
  # to reproduce pre-2026-08-29 numbers.
  intrabar_stop_management: true
  # Apply the spread outlier guard, volatility regime guard, three-strikes
  # pause, and bar-time daily loss limit that main.py applies. Off means the
  # summary lists them as not modelled.
  model_live_gates: true
  commission_per_lot: 7.0
  default_spread_pips:
    XAUUSD: 20
    XAUUSD_o: 20
    EURUSD: 1.0
    EURUSD_o: 1.0
    EURJPY: 1.5
    EURJPY_o: 1.5
    USDJPY: 1.2
    USDJPY_o: 1.2
    BTCUSD: 25
    ETHUSD: 25

alerting:
  enabled: false
  telegram_enabled: true
  discord_enabled: true
  timeout_seconds: 5
  prefix: ChronoScalp
  # Extra Telegram copy sent the moment a trade fills. Change the id from
  # Telegram Settings -> اعلان معامله. Recipient must Start this bot first;
  # private users usually need a numeric chat_id, not @username.
  trade_open_copy_enabled: true
  trade_open_copy_chat_id: "@taranomrashid"

resilience:
  max_consecutive_errors: 5
  reconcile_interval_seconds: 60
  skip_heartbeat_seconds: 300
  alert_on_daily_loss_limit: true
  stale_data_seconds: 120
