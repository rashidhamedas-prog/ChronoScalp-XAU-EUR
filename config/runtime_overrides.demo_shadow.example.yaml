# Committed Demo/Shadow example — copy to runtime_overrides.yaml on the host.
# See also the live file (gitignored): config/runtime_overrides.yaml
# Does NOT replace config/settings.yaml.

symbols:
  - XAUUSD_o
  - EURUSD_o
  - USDJPY_o

strategy:
  enabled_strategies:
    - liquidity_volume
  use_smc_confluence: false
  use_liquidity_volume: true
  use_ultra_scalp: false
  use_news_straddle: false
  min_reward_risk_ratio: 1.5
  ultra_scalp:
    min_reward_risk_ratio: 1.5
    net_rr_after_costs: 1.25

sessions:
  trading_hours_mode: london_ny
  trade_outside_sessions: false
  windows:
    london:
      start: "08:00"
      end: "11:00"
    new_york:
      start: "13:30"
      end: "16:30"
  market_timezones:
    london: Europe/London
    new_york: America/New_York

news_filter:
  enabled: true
  high_impact_only: true
  blackout_minutes_before: 30
  blackout_minutes_after: 30
  fail_closed_when_stale: true
  max_calendar_age_minutes: 60

risk:
  max_risk_per_trade_pct: 1.0
  active_risk_per_trade_pct: 0.25
  risk_presets_pct:
    - 0.25
    - 0.5
    - 1.0
    - 1.5
  min_reward_risk_ratio: 1.5
  max_portfolio_heat_pct: 1.0
  max_concurrent_positions: 1
  independent_symbol_entries: false
  max_daily_loss_pct: 1.0
  max_weekly_loss_pct: 3.0
  max_monthly_loss_pct: 6.0
  daily_loss_limit_enabled: true
  max_trades_per_symbol_day: 3
  max_trades_portfolio_day: 3
  cooldown_after_loss_minutes: 60
  three_strikes:
    enabled: true
    max_losses: 2
    pause_hours: 24
    persistent: true
  correlation:
    enabled: true
    period: 60
    max_abs_corr: 0.75
    use_returns: true
  partial_tp:
    enabled: false
  chandelier:
    enabled: false
  daily_drawdown_close_all: true

ml:
  enabled: false

execution:
  broker: paper
  data_source: mt5
  trade_on_bar_close_only: true
  single_instance: true
  max_entry_slippage_r_fraction: 0.10
  max_risk_overrun_pct: 0.0
  state_dir: data/state

oanda:
  environment: practice

alerting: {}
